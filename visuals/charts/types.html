<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>типы графиков — null/charts</title>
<link rel="stylesheet" href="../../styles/main.css">
<style>
  .ex-tag {
    font-family: var(--font-mono);
    font-size: 9px;
    color: #bbb;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .ex-h1 {
    font-family: "Old Standard TT", Georgia, serif;
    font-size: 36px;
    font-weight: normal;
    line-height: 1.1;
    margin: 0 0 10px 0;
  }
  .ex-sub {
    font-family: "Old Standard TT", Georgia, serif;
    font-style: italic;
    font-size: 16px;
    color: #666;
    line-height: 1.55;
    max-width: 620px;
  }

  .filter-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 24px 0 28px 0;
  }
  .filter-pill {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: .04em;
    background: transparent;
    border: 1px solid #ddd;
    color: #888;
    padding: 5px 11px;
    cursor: pointer;
  }
  .filter-pill:hover { border-color: #111; color: #111; }
  .filter-pill.active { border-color: #111; color: #111; background: #f0ede8; }

  .types-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: #ddd;
    border: 1.5px solid #111;
  }
  @media (max-width: 580px) { .types-grid { grid-template-columns: 1fr; } }

  .type-card {
    background: #f7f6f2;
    padding: 28px 24px;
    position: relative;
    transition: opacity 0.2s ease;
  }
  .type-card.dim { opacity: 0.2; pointer-events: none; }
  .card-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: #bbb;
    letter-spacing: .1em;
    margin-bottom: 4px;
  }
  .card-cat {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: #bbb;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  .card-preview {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    line-height: 1.5;
    color: #111;
    white-space: pre;
    margin: 14px 0;
    min-height: 100px;
  }
  .card-name {
    font-family: 'Old Standard TT', Georgia, serif;
    font-size: 24px;
    font-weight: 400;
    color: #111;
    line-height: 1.15;
    margin: 4px 0 4px 0;
  }
  .card-year {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: #bbb;
    letter-spacing: .06em;
    margin-bottom: 10px;
  }
  .card-desc {
    font-family: var(--font-sans);
    font-size: 13px;
    color: #666;
    line-height: 1.6;
    margin-bottom: 14px;
  }
  .card-when {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    line-height: 1.8;
    border-top: 1px dashed #ddd;
    padding-top: 10px;
    letter-spacing: .02em;
  }
  .when-yes { color: #1a7a4a; }
  .when-no  { color: #c44a32; }

  .card-consensus {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px dashed #ddd;
  }
  .consensus-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: #bbb;
    letter-spacing: .1em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .consensus-rule {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 6px;
    font-size: 11px;
    line-height: 1.5;
  }
  .consensus-pct {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: #bbb;
    min-width: 32px;
    flex-shrink: 0;
    padding-top: 1px;
  }
  .consensus-pct.high { color: #1a7a4a; }
  .consensus-pct.mid  { color: #e67e22; }
  .consensus-rule-text {
    color: #555;
    font-size: 11px;
    line-height: 1.5;
  }
  .consensus-source {
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px;
    color: #ccc;
    margin-top: 4px;
    letter-spacing: .04em;
  }
  .when-label {
    color: #aaa;
    text-transform: uppercase;
    letter-spacing: .1em;
    font-size: 8px;
    display: inline-block;
    width: 56px;
  }
</style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="../">null</a>
  <nav>
    <a href="../../objects/">объекты</a>
    <a href="../../essays/">эссе</a>
    <a href="../">визуалы</a>
    <a href="./" class="active">графики</a>
    <a href="../../music/">музыка</a>
    <a href="/null/map.html">карта</a>
    <a href="/null/find.html">find</a>
  </nav>
</header>
<div class="breadcrumb">/null / visuals / charts / types</div>

<main class="container">
<article>

  <div class="ex-tag">графики · галерея типов</div>
  <h1 class="ex-h1">типы графиков</h1>
  <p class="ex-sub">каждый тип — отдельный инструмент. история, идея, когда применять.</p>

  <hr class="section-divider" style="margin-top:24px;">

  <div class="filter-row" id="filter"></div>

  <div class="types-grid" id="grid"></div>

</article>
</main>

<footer class="footer">
  <span>/null/visuals/charts/types.html</span>
  <a href="../../man.html">about →</a> · <a href="/null/map.html">map →</a> · <a href="/null/visuals/charts/">charts →</a> · <a href="/null/books/">books →</a> · <a href="/null/find.html">find →</a>
</footer>

<script>
(() => {
  const TYPES = [
    {
      num: '№001', cat: 'сравнение', name: 'bar chart',
      year: 'Уильям Плейфэр · 1786',
      preview:
        'A │████████████│ 47\n' +
        'B │██████░░░░░░│ 23\n' +
        'C │█████████░░░│ 38\n' +
        'D │███░░░░░░░░░│ 12',
      desc: 'сравнение дискретных категорий по величине. самый универсальный тип графика.',
      yes: 'сравнить N категорий · показать рейтинг · выделить максимум и минимум',
      no:  'непрерывные данные · больше 20 категорий · временные ряды',
      consensus: [
        { pct: 100, text: 'начинай ось с нуля' },
        { pct: 82,  text: 'используй bar chart для сравнения категорий' },
        { pct: 71,  text: 'сортируй от большего к меньшему' }
      ]
    },
    {
      num: '№002', cat: 'временной ряд', name: 'line chart',
      year: 'Уильям Плейфэр · 1786',
      preview:
        '     ●\n' +
        '    ●│●\n' +
        '   ● │ ●\n' +
        '  ●  │  ●●\n' +
        ' ●───┼────●',
      desc: 'изменение значения во времени. показывает тренд и динамику.',
      yes: 'временной ряд · непрерывные данные · тренд',
      no:  'категории без порядка · слишком много линий (>5)',
      consensus: [
        { pct: 100, text: 'используй для изменений во времени' },
        { pct: 94,  text: 'не более 4 линий на одном графике' },
        { pct: 67,  text: 'не обрезай ось — начинай с нуля' }
      ]
    },
    {
      num: '№003', cat: 'связь', name: 'scatter plot',
      year: 'Джон Гершель · 1833',
      preview:
        ' 9│  · ·\n' +
        ' 6│·   ·  ·\n' +
        ' 3│  ·  ·\n' +
        ' 0│·      ·\n' +
        '  └────────',
      desc: 'зависимость между двумя переменными. каждая точка — наблюдение.',
      yes: 'корреляция двух переменных · выбросы · кластеры',
      no:  'одна переменная · категориальные данные',
      consensus: [
        { pct: 100, text: 'убедись что считаешь правильную переменную' },
        { pct: 93,  text: 'используй scatter для связи двух переменных' },
        { pct: 78,  text: 'используй прозрачность при наложении точек' }
      ]
    },
    {
      num: '№004', cat: 'распределение', name: 'histogram',
      year: 'Карл Пирсон · 1895',
      preview:
        '    ██\n' +
        '   ████\n' +
        '  ██████\n' +
        ' ████████\n' +
        '──────────',
      desc: 'распределение числовой переменной по диапазонам (бакетам).',
      yes: 'распределение данных · нормальность · выбросы',
      no:  'категориальные данные (там bar chart)',
      note: 'гайдлайны для histogram не вошли в консенсус ни одной организации. используй равные интервалы (бакеты).'
    },
    {
      num: '№005', cat: 'временной ряд', name: 'area chart',
      year: 'Уильям Плейфэр · 1786',
      preview:
        '     ●\n' +
        '    ●▓●\n' +
        '   ●▓▓▓●\n' +
        '  ●▓▓▓▓▓●\n' +
        '──────────',
      desc: 'как line chart но с заливкой. подчёркивает накопленный объём.',
      yes: 'накопленный объём важнее точных значений · несколько рядов',
      no:  'точные значения важны · много пересечений',
      consensus: [
        { pct: 100, text: 'используй для нескольких категорий во времени' },
        { pct: 77,  text: 'избегай перекрытия при >2 рядах данных' },
        { pct: 77,  text: 'начинай ось Y с нуля при >1 ряде' }
      ]
    },
    {
      num: '№006', cat: 'часть/целое', name: 'pie chart',
      year: 'Уильям Плейфэр · 1801',
      preview:
        '   ████\n' +
        ' ██░░░░██\n' +
        ' █░░  ░░█\n' +
        ' ██░░░░██\n' +
        '   ████',
      desc: 'доли целого. спорный тип — человеку сложно сравнивать углы.',
      yes: '2–3 категории · доли которые в сумме дают 100%',
      no:  'больше 5 категорий · близкие значения · точные числа важны',
      consensus: [
        { pct: 96, text: 'не используй если «остальное» делает chart бессмысленным' },
        { pct: 88, text: 'используй для сравнения части с целым' },
        { pct: 78, text: 'не более 5 сегментов' }
      ]
    },
    {
      num: '№007', cat: 'распределение', name: 'box plot',
      year: 'Джон Тьюки · 1970',
      preview:
        '\n' +
        '  ├──[  │  ]──┤\n' +
        '\n' +
        '  min Q1 Q2 Q3 max',
      desc: 'пять числовых сводок: min Q1 медиана Q3 max. видны выбросы и симметрия.',
      yes: 'сравнить распределения · выбросы · асимметрия',
      no:  'маленькая выборка (<20) · одна группа',
      note: 'box plot изобрёл Джон Тьюки в 1970. стандарт для показа распределения в научных публикациях.'
    },
    {
      num: '№008', cat: 'связь', name: 'heatmap',
      year: 'Жак Бертен · 1967',
      preview:
        ' · · ░ ░ ▒\n' +
        ' · ░ ▒ ▓ █\n' +
        ' ░ ▒ ▓ █ █\n' +
        ' ░ ░ ▒ ▓ ▓',
      desc: 'матрица значений где цвет = величина. паттерны в двумерных данных.',
      yes: 'корреляционная матрица · паттерны в 2D · большие таблицы',
      no:  'точные значения важны · одна переменная',
      consensus: [
        { pct: 100, text: 'используй непрерывную цветовую палитру' },
        { pct: 53,  text: 'используй для связи между двумя переменными' }
      ]
    },
    {
      num: '№009', cat: 'сравнение', name: 'radar chart',
      year: 'Георг фон Майр · 1877',
      preview:
        '      ●\n' +
        '     /|\\\n' +
        '    / | \\\n' +
        '   ●──┼──●\n' +
        '    \\ | /\n' +
        '     \\|/\n' +
        '      ●',
      desc: 'профиль по нескольким осям. хорошо для сравнения объектов по многим критериям.',
      yes: 'профиль объекта · 4–8 осей · сравнение нескольких объектов',
      no:  'больше 10 осей · точные значения важны',
      note: 'радар-чарт — спорный тип. bar chart часто передаёт ту же информацию понятнее.'
    },
    {
      num: '№010', cat: 'сравнение', name: 'bubble chart',
      year: 'Hans Rosling · 2006',
      preview:
        '\n' +
        '   ·    ○      ●\n' +
        '      ●    ·\n' +
        '   ○       ·   ○\n',
      desc: 'scatter plot где размер пузыря = третья переменная. три измерения на плоскости.',
      yes: 'три переменные · размер важен как измерение',
      no:  'много точек (сливаются) · размер сложно читать точно',
      consensus: [
        { pct: 100, text: 'не используй при большом количестве точек' },
        { pct: 62,  text: 'используй для паттернов и связей с доп. измерением' },
        { pct: 62,  text: 'добавь легенду для размера пузырей' }
      ]
    },
    {
      num: '№011', cat: 'часть/целое', name: 'waterfall',
      year: 'McKinsey & Company · ~1990s',
      preview:
        '   ┌─┐\n' +
        '   │+│┌─┐\n' +
        '   │ ││+│┌─┐\n' +
        '   │ ││ ││-│\n' +
        '   └─┘└─┘└─┘',
      desc: 'показывает как промежуточные значения приводят к итоговому. плюсы и минусы.',
      yes: 'анализ изменений · мост от начального к конечному значению',
      no:  'непрерывные данные · нет нарратива о причинах изменений',
      note: 'waterfall chart изобрела McKinsey в 1990-х для финансовых презентаций. используй только когда важен нарратив изменений.'
    },
    {
      num: '№012', cat: 'временной ряд', name: 'step chart',
      year: 'вариант line chart',
      preview:
        '\n' +
        '       ┌──┐\n' +
        '    ┌──┘  │\n' +
        '  ──┘     └──\n',
      desc: 'значение постоянно до следующего изменения. для дискретных событий.',
      yes: 'процентные ставки · тарифы · дискретные переходы',
      no:  'непрерывные изменения',
      note: 'step chart — вариант line chart для дискретных переходов. стандарт для отображения процентных ставок и тарифов.'
    }
  ];

  const escapeHTML = (s) => s.replace(/[&<>]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

  // ── render filter ──────────────────────────────────────────────────
  const counts = { 'все': TYPES.length };
  TYPES.forEach((t) => { counts[t.cat] = (counts[t.cat] || 0) + 1; });
  const order = ['все', 'сравнение', 'распределение', 'связь', 'часть/целое', 'временной ряд'];
  const filterEl = document.getElementById('filter');
  filterEl.innerHTML = order
    .filter((k) => counts[k])
    .map((k) => '<button class="filter-pill' + (k === 'все' ? ' active' : '') + '" data-c="' + k + '">' + k + ' · ' + counts[k] + '</button>')
    .join('');

  // ── render cards ───────────────────────────────────────────────────
  const pctClass = (p) => p >= 80 ? 'high' : p >= 60 ? 'mid' : '';
  const renderConsensus = (t) => {
    if (t.consensus && t.consensus.length) {
      const rules = t.consensus.map((r) =>
        '<div class="consensus-rule">' +
          '<span class="consensus-pct ' + pctClass(r.pct) + '">' + r.pct + '%</span>' +
          '<span class="consensus-rule-text">' + escapeHTML(r.text) + '</span>' +
        '</div>'
      ).join('');
      return (
        '<div class="card-consensus">' +
          '<div class="consensus-label">// консенсус · washu vis</div>' +
          rules +
          '<div class="consensus-source">источник: washuvis · 42 организации · 971 правило</div>' +
        '</div>'
      );
    }
    if (t.note) {
      return (
        '<div class="card-consensus">' +
          '<div class="consensus-label">// заметка</div>' +
          '<div class="consensus-rule">' +
            '<span class="consensus-rule-text" style="color:#888;font-style:italic">' + escapeHTML(t.note) + '</span>' +
          '</div>' +
        '</div>'
      );
    }
    return '';
  };

  const grid = document.getElementById('grid');
  grid.innerHTML = TYPES.map((t) => `
    <div class="type-card" data-cat="${t.cat}">
      <div class="card-num">${t.num}</div>
      <div class="card-cat">${t.cat}</div>
      <pre class="card-preview">${escapeHTML(t.preview)}</pre>
      <div class="card-name">${t.name}</div>
      <div class="card-year">${t.year}</div>
      <div class="card-desc">${t.desc}</div>
      <div class="card-when">
        <div><span class="when-label">когда</span><span class="when-yes">${t.yes}</span></div>
        <div><span class="when-label">не когда</span><span class="when-no">${t.no}</span></div>
      </div>
      ${renderConsensus(t)}
    </div>
  `).join('');

  // ── filter logic ───────────────────────────────────────────────────
  filterEl.querySelectorAll('.filter-pill').forEach((b) => {
    b.onclick = () => {
      const cat = b.dataset.c;
      filterEl.querySelectorAll('.filter-pill').forEach((x) => x.classList.remove('active'));
      b.classList.add('active');
      grid.querySelectorAll('.type-card').forEach((card) => {
        const match = (cat === 'все') || (card.dataset.cat === cat);
        card.classList.toggle('dim', !match);
      });
    };
  });
})();
</script>

</body>
</html>
